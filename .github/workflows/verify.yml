name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    name: Source checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify repository
        run: python tools/verify_release.py
      - name: Check portable commands
        run: |
          python tools/setup_workspace.py --help
          python tools/build_release.py --help
          python apex-zmk-g4b/build_g4b.py --help
          python installer/build_migration.py --help
          python apex-zmk-slot/scripts/build.py --help
          python tools/build_dongle.py --help
          python tools/build_dongle_bundle.py --help
          python -m unittest discover -s dongle/installer -p test_install.py -v
      - name: Radio and USB queue regression tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for test in radio/tests/test_*.py dongle/tests/test_*.py; do
            # Skip tests that need a built receiver ELF (unicorn/pyelftools); the
            # radio.yml job runs those against the compiled apex-receiver.elf.
            case "$test" in
              *test_packet.py|*/test_gamepad.py|*/test_keyboard_shell.py|*/test_update.py) continue;;
            esac
            python "$test"
          done
