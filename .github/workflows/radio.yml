name: Build keyboard and receiver

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      WORK_ROOT: /tmp/apex-radio-work
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Prepare pinned dependencies
        run: python tools/setup_workspace.py --work-root "$WORK_ROOT"
      - name: Build receiver and stock USB installer
        run: python tools/build_dongle_bundle.py --workspace "$WORK_ROOT/zmk-upstream" --output "$WORK_ROOT/dongle"
      - name: Test bootloader and installer ARM code
        run: |
          "$WORK_ROOT/zmk-upstream/.venv/bin/python" -m pip install unicorn==2.1.4 cryptography pyserial
          "$WORK_ROOT/zmk-upstream/.venv/bin/python" dongle/bootloader/test_bootloader_arm.py "$WORK_ROOT/dongle/apex-dongle"
          "$WORK_ROOT/zmk-upstream/.venv/bin/python" dongle/installer/test_migration_arm.py "$WORK_ROOT/dongle/apex-dongle"
          "$WORK_ROOT/zmk-upstream/.venv/bin/python" dongle/installer/test_migration_arm.py "$WORK_ROOT/dongle/apex-dongle" readback
      - name: Test compiled receiver gamepad
        run: >-
          "$WORK_ROOT/zmk-upstream/.venv/bin/python" dongle/tests/test_gamepad.py
          --elf "$WORK_ROOT/dongle/apex-dongle/apex-receiver.elf"
      - name: Test receiver keyboard commands
        run: >-
          "$WORK_ROOT/zmk-upstream/.venv/bin/python" dongle/tests/test_keyboard_shell.py
          --elf "$WORK_ROOT/dongle/apex-dongle/apex-receiver.elf"
      - name: Test receiver binary update parser
        run: >-
          "$WORK_ROOT/zmk-upstream/.venv/bin/python" dongle/tests/test_update.py
          "$WORK_ROOT/dongle/apex-dongle/apex-receiver.elf"
      - name: Build matching keyboard firmware
        run: >-
          python apex-zmk-g4b/build_g4b.py --stage 3 --usb-studio --kscan-ingest
          --persistent --plain-image --wireless-idle --ab-rollback --shell
          --extra-conf apex-zmk-g4b/g4b_shell_release.conf
          --extra-conf apex-zmk-g4b/g4b_radio_input.conf
          --extra-conf apex-zmk-g4b/g4b_radio_update.conf
          --extra-conf apex-zmk-g4b/g4b_release_size.conf --work-root "$WORK_ROOT"
      - name: Build and test keyboard update bootloader
        run: |
          python tools/build_release.py --work-root "$WORK_ROOT" --bootloader-only
          "$WORK_ROOT/zmk-upstream/.venv/bin/python" update/test_bootloader.py "$WORK_ROOT"/release-deps/adafruit-boot-*/_build_apex_release/bootloader.elf
          "$WORK_ROOT/zmk-upstream/.venv/bin/python" update/test_bootloader_flash.py "$WORK_ROOT"/release-deps/adafruit-boot-*/_build_apex_release/bootloader.elf
      - name: Test radio protocol
        run: '"$WORK_ROOT/zmk-upstream/.venv/bin/python" radio/tests/test_packet.py --workspace "$WORK_ROOT/zmk-upstream" --output "$WORK_ROOT/radio-tests"'
      - name: Test wireless update engine and image validation
        run: |
          python update/test_update.py --tinycrypt "$WORK_ROOT/zmk-upstream/modules/crypto/tinycrypt/lib"
          "$WORK_ROOT/zmk-upstream/.venv/bin/python" tools/test_wireless_update.py
      - name: Test compiled NOR read loop
        run: >-
          "$WORK_ROOT/zmk-upstream/.venv/bin/python" apex-zmk-g4b/test_spinor_read.py
          "$WORK_ROOT/build-repo-apex-zmk-g4b-wireless-idle-ab-v2/zephyr/zmk.elf"
      - name: Test compiled keyboard radio shell
        run: >-
          "$WORK_ROOT/zmk-upstream/.venv/bin/python" apex-zmk-g4b/test_radio_shell.py
          "$WORK_ROOT/build-repo-apex-zmk-g4b-wireless-idle-ab-v2/zephyr/zmk.elf"
      - name: Upload receiver installer and firmware
        uses: actions/upload-artifact@v4
        with:
          name: apex-dongle
          path: /tmp/apex-radio-work/dongle/apex-dongle.zip
          if-no-files-found: error
      - name: Upload matching keyboard firmware and configuration
        uses: actions/upload-artifact@v4
        with:
          name: apex-keyboard-radio
          path: /tmp/apex-radio-work/artifacts-repo-apex-zmk-g4b-wireless-idle-ab-v2/*
          if-no-files-found: error
      - name: Upload keyboard update bootloader
        uses: actions/upload-artifact@v4
        with:
          name: experimental-keyboard-update-bootloader
          path: |
            /tmp/apex-radio-work/release-deps/adafruit-boot-*/_build_apex_release/bootloader_mbr.uf2
            /tmp/apex-radio-work/release-deps/adafruit-boot-*/_build_apex_release/bootloader.elf
          if-no-files-found: error
