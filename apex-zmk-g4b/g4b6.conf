# G4B-6 NVS BRING-UP: the first stage that writes flash.
# and the four G4B lines at the end. Every other line is byte-identical.
CONFIG_ZMK_KEYBOARD_NAME="APX-ZMK-G4B6"
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=n
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
CONFIG_BT_DEVICE_NAME_MAX=16

# G4A is deliberately write-free. Pairing state may exist only in RAM.
# CONFIG_SETTINGS=n   <- lifted for stage 6; see below
# CONFIG_BT_SETTINGS=n   <- lifted for stage 6; see below
# CONFIG_NVS=n   <- lifted for stage 6; see below
# SETTINGS_NVS is a choice symbol; assigning it while SETTINGS=n only produces
# a "no symbol ended up as the choice selection" warning. SETTINGS=n is what
# actually removes it.
# CONFIG_FLASH=n   <- lifted for stage 6; see below
# CONFIG_FLASH_MAP=n   <- lifted for stage 6; see below
# CONFIG_FLASH_PAGE_LAYOUT=n   <- lifted for stage 6; see below

# ZMK_PM/ZMK_PM_DEVICE_SUSPEND_RESUME are promptless and only ever selected by
# ZMK_SLEEP or ZMK_PM_SOFT_OFF. Both are forced off here, so they stay off; the
# generated .config is the thing the audit verifies, not this fragment.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_PM_SOFT_OFF=n
CONFIG_POWEROFF=n
CONFIG_WATCHDOG=n
CONFIG_REBOOT=n

CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_SHELL=n
CONFIG_LOG=n
# BOOT_BANNER defaults y and selects PRINTK + EARLY_CONSOLE, which overrides a
# bare CONFIG_PRINTK=n. Disable the banner so PRINTK really resolves to n.
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n

CONFIG_SPI=n
CONFIG_GPIO=n
CONFIG_PINCTRL=n
# APEX_STM32_KSCAN is promptless and defaults to dt_compat_enabled(). The G4A
# overlay retargets kscan0 to the no-I/O compatible, so no node claims the
# STM32 compatible and the symbol resolves to n on its own.
CONFIG_APEX_RECOVERY=n

CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n
CONFIG_SRAM_SIZE=116
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_NRF_APPROTECT_LOCK=n

CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y

# --- G4B additions (the only delta from the passing G4A2 configuration) ---
#
# Stage is a build-time constant, never a runtime flag, so verify_g4b.py can
# assert exactly which stage is in the binary. Stage 0 = OBSERVE: zero bytes on
# the wire, SPIM3 never enabled.
CONFIG_APEX_G4B_STAGE=6
CONFIG_APEX_G4B_UART_EVIDENCE=y
# Set from stage 0 onwards even though stage 0 never ingests, so the value is
# identical across all four G4B images and cannot become a stage-3-only
# regression. The Zephyr default is 4; ZMK discards k_msgq_put's return code and
# updates its shadow regardless, so a >4-key chord release would strand keys.
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=64

# --- stage 6: the flash stack ---
#
# The board defconfig already carries FLASH/FLASH_MAP/FLASH_PAGE_LAYOUT/NVS;
# g4b.conf overrode them off because the only partition available was at
# 0x61000, inside the CRC-covered vendor image. g4b6.overlay puts one at
# 0x7A000 instead, in flash G4B-4 measured as erased and outside that region,
# so the reason for the override no longer applies.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# Deliberately still off. This stage proves raw NVS on this partition and
# nothing else; the settings layer and BLE bonds are the next increment, and
# keeping them out means a failure here is unambiguously a flash failure.
CONFIG_SETTINGS=n
CONFIG_BT_SETTINGS=n
