# SPDX-License-Identifier: MIT

# Main USB/Bluetooth firmware configuration.
CONFIG_ZMK_KEYBOARD_NAME="Apex Pro Mini WL"
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB_BOOT=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
CONFIG_BT_DEVICE_NAME_MAX=16

# The current Zephyr USB device stack provides keyboard, gamepad, and Studio
# interfaces. USB initialization waits for VBUS so a battery boot does not keep
# the high-frequency crystal running.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DRIVER=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USBD_HID_SUPPORT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_HID=n
CONFIG_USB_CDC_ACM=n

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# The key combo and the dedicated serial update port both enter APEXBOOT.
CONFIG_REBOOT=y
CONFIG_APEX_G4B_DFU_TRIGGER=y
CONFIG_INIT_ARCH_HW_AT_BOOT=y

# Scanner link and key input.
CONFIG_APEX_G4B_STAGE=3
CONFIG_APEX_G4B_KSCAN_INGEST=y
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=64
CONFIG_APEX_G4B_DEADLINE_MS=1000
CONFIG_APEX_G4B_THREAD_DELAY_MS=250
CONFIG_APEX_G4B_STM32_RESET_MS=250

# System ON idle keeps Bluetooth connected and lets the scanner attention line
# wake the nRF immediately. The scanner timing itself is in
# g4b_wireless_idle.conf.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_PM_SOFT_OFF=n
CONFIG_POWEROFF=n
# The board code adopts a watchdog across bootloader resets, which Zephyr's
# generic driver cannot do after the peripheral has already started.
CONFIG_WATCHDOG=n
CONFIG_APEX_G4B_WATCHDOG=y
CONFIG_APEX_G4B_SLEEP_MS=0
CONFIG_APEX_G4B_IDLE_POLL_MS=200
CONFIG_APEX_G4B_BAG_GUARD=y
CONFIG_APEX_G4B_BAG_KEYS=4
CONFIG_APEX_G4B_BAG_IDLE_MS=8000
CONFIG_APEX_G4B_BAG_POLL_MS=250

# RGB and Hall-effect controls.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_APEX_G4B_RGB_IDLE_MS=30000
CONFIG_APEX_G4B_RAPID_TRIGGER=3
CONFIG_APEX_G4B_GAMEPAD=y

# Bluetooth bonds, settings, A/B recovery, and crash records use the external
# SPI NOR. LittleFS is not mounted because no firmware feature uses it.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
CONFIG_APEX_G4B_SPINOR_FLASHDEV=y
CONFIG_APEX_G4B_SPINOR_NVS_PROVISION=y
CONFIG_APEX_G4B_LITTLEFS=n
CONFIG_FILE_SYSTEM=n
CONFIG_FILE_SYSTEM_LITTLEFS=n
CONFIG_APEX_G4B_COREDUMP=y
CONFIG_MAIN_STACK_SIZE=2048

# Battery charging.
CONFIG_APEX_G4B_CHARGE_LIMIT=y
CONFIG_APEX_G4B_BATT_FULL_MV=4096
CONFIG_APEX_G4B_CHARGE_STORAGE=y
CONFIG_APEX_G4B_CHARGE_STOP_PCT=80
CONFIG_APEX_G4B_CHARGE_RESUME_PCT=72

# These drivers access fixed nRF peripherals directly. Enabling the generic
# GPIO, pinctrl, or SPI stacks would create a second owner for the same pins.
CONFIG_SPI=n
CONFIG_GPIO=n
CONFIG_PINCTRL=n
CONFIG_APEX_RECOVERY=n

# Keep SWD recovery available. Stack sentinels remain enabled because hardware
# stack protection is not used with this board's custom memory layout.
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=n
CONFIG_SRAM_SIZE=128
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_NRF_APPROTECT_LOCK=n
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y

# Production logging. ZMK recommends leaving logging off on battery-powered
# builds. A local diagnostic override can enable informational logging.
CONFIG_LOG=n
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_FAULT_DUMP=0
CONFIG_SHELL=n
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n

# The record structures remain compiled because the scanner and coredump paths
# share them, but the release sends nothing over the evidence UART or USB port.
CONFIG_APEX_G4B_UART_EVIDENCE=y
CONFIG_APEX_G4B_UART_EMIT=n
CONFIG_APEX_G4B_EVIDENCE_USB=n
CONFIG_APEX_G4B_KBD_TELEMETRY=n
CONFIG_APEX_G4B_KBD_CAPTURE=n

# Development probes and unfinished transports are not part of the release.
CONFIG_APEX_G4B_BATT_PROBE=n
CONFIG_APEX_G4B_TWIM_PROBE=n
CONFIG_APEX_G4B_BQ_PROBE=n
CONFIG_APEX_G4B_RGB_PROBE=n
CONFIG_APEX_G4B_PIN_SURVEY=n
CONFIG_APEX_G4B_USB_KICK=n
CONFIG_APEX_G4B_SPINOR_DUMP=n
CONFIG_APEX_G4B_SPINOR_WRITETEST=n
CONFIG_APEX_G4B_SPINOR_FLASHDEV_SELFTEST=n
CONFIG_APEX_G4B_AB_CRASHTEST=n
CONFIG_APEX_G4B_DONGLE_RADIO=n
CONFIG_APEX_G4B_ESB=n
CONFIG_APEX_G4B_UPDATER=n
CONFIG_APEX_G4B_USB_RECOVERY=n
CONFIG_APEX_G4B_SW_RECOVERY=n
