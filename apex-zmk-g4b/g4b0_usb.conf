# Stage-0 USB diagnostic. It starts ZMK and USB without powering or talking to
# the STM32 scanner, which isolates enumeration from scanner-link activity.
# SPDX-License-Identifier: MIT

# ZMK Studio over USB CDC-ACM; key scanning is disabled by stage 0.
CONFIG_ZMK_KEYBOARD_NAME="APX-ZMK-G4B0SP"
CONFIG_ZMK_BLE=y
# CONFIG_ZMK_USB=n   <- lifted for the USB Studio transport
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
CONFIG_BT_DEVICE_NAME_MAX=16

# G4A is deliberately write-free. Pairing state may exist only in RAM.
# CONFIG_SETTINGS=n   <- lifted; this build persists bonds
# CONFIG_BT_SETTINGS=n   <- lifted; this build persists bonds
# CONFIG_NVS=n   <- lifted; this build persists bonds
# SETTINGS_NVS is a choice symbol; assigning it while SETTINGS=n only produces
# a "no symbol ended up as the choice selection" warning. SETTINGS=n is what
# actually removes it.
# CONFIG_FLASH=n   <- lifted; this build persists bonds
# CONFIG_FLASH_MAP=n   <- lifted; this build persists bonds
# CONFIG_FLASH_PAGE_LAYOUT=n   <- lifted; this build persists bonds

# ZMK_PM/ZMK_PM_DEVICE_SUSPEND_RESUME are promptless and only ever selected by
# ZMK_SLEEP or ZMK_PM_SOFT_OFF. Both are forced off here, so they stay off; the
# generated .config is the thing the audit verifies, not this fragment.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_PM_SOFT_OFF=n
CONFIG_POWEROFF=n
CONFIG_WATCHDOG=n
CONFIG_REBOOT=n

# CONFIG_SERIAL=n   <- lifted for the USB Studio transport
# CONFIG_CONSOLE=n   <- lifted for the USB Studio transport
CONFIG_SHELL=n
CONFIG_LOG=n
# BOOT_BANNER defaults y and selects PRINTK + EARLY_CONSOLE, which overrides a
# bare CONFIG_PRINTK=n. Disable the banner so PRINTK really resolves to n.
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n

CONFIG_SPI=n
CONFIG_GPIO=n
CONFIG_PINCTRL=n
# APEX_STM32_KSCAN is promptless and defaults to dt_compat_enabled(). The G4A
# overlay retargets kscan0 to the no-I/O compatible, so no node claims the
# STM32 compatible and the symbol resolves to n on its own.
CONFIG_APEX_RECOVERY=n

CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n
CONFIG_SRAM_SIZE=116
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_NRF_APPROTECT_LOCK=n

CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y

# --- G4B additions (the only delta from the passing G4A2 configuration) ---
#
# Stage is a build-time constant, never a runtime flag, so verify_g4b.py can
# assert exactly which stage is in the binary. Stage 0 = OBSERVE: zero bytes on
# the wire, SPIM3 never enabled.
CONFIG_APEX_G4B_STAGE=0
CONFIG_APEX_G4B_UART_EVIDENCE=y
# Set from stage 0 onwards even though stage 0 never ingests, so the value is
# identical across all four G4B images and cannot become a stage-3-only
# regression. The Zephyr default is 4; ZMK discards k_msgq_put's return code and
# updates its shadow regardless, so a >4-key chord release would strand keys.
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=64

# Stage 3 needs a long window: the operator has to press keys inside it. 45 s of
# polling plus ~1.6 s of bring-up, replay and evidence leaves roughly 13 s of
# margin against the wrapper's ~60 s watchdog.
CONFIG_APEX_G4B_DEADLINE_MS=45000

# ON. This is the G4C follow-up: captured bitmaps are additionally pushed through
# apex_g4b_kscan_ingest_bitmap() into ZMK's kscan callback, event queue, HID
# pipeline and BLE endpoint. Everything else is byte-identical to G4B-3.
# CONFIG_APEX_G4B_KSCAN_INGEST is not set

# --- persistent storage, so a bonded host can actually receive HID ---
#
# Key ingest alone is not enough to type. HID-over-GATT requires an encrypted
# link, which requires a bond, which requires somewhere to keep it. The
# original G4C had SETTINGS=n, so flashing it would have dropped the pairing
# and the keys would have had nowhere to go.
#
# The NVS store lives at 0x7A000, OUTSIDE the vendor image (0x1C000-0x67000),
# and the vendor updater only writes the image - so an existing bond survives
# this reflash rather than being wiped with it.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# --- ZMK Studio over USB CDC-ACM (WebSerial) ---
#
# USB terminates at the Nordic, not the STM32 - see g4b_usb.overlay. This is
# the transport the Studio web app normally uses, and unlike the BLE GATT
# transport it needs no pairing and no encrypted link.
#
# These six are exactly ZMK's studio-rpc-usb-uart snippet.
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

CONFIG_ZMK_STUDIO=y

# Locking off for the same reason as the BLE Studio build: the keymap has no
# &studio_unlock binding, so with locking on Studio would connect and reject
# every change. A production build should re-enable it and add the binding.
CONFIG_ZMK_STUDIO_LOCKING=n
