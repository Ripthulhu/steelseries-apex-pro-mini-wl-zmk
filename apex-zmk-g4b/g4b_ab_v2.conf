# A/B recovery layout shared by the application and bootloader.
#
# The app and bootloader share descriptor version 2 and the full
# 0x8B000+0x71000 image-B slot in external NOR.
CONFIG_APEX_G4B_AB_ROLLBACK=y
CONFIG_APEX_G4B_AB_AUTOSTAGE=y
CONFIG_APEX_G4B_AB_CRASHTEST=n
