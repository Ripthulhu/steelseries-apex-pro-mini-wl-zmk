# Release size trims. The full BLE + 2.4 GHz + wireless-update build must end
# below the bootloader self-update staging floor (0x63000) so APEXBOOT can still
# replace the bootloader without clipping the application. No firmware code
# formats %f/%g/%e, so the floating-point printf/formatting support is dead
# weight (~6 KiB across picolibc's __dtoa engine and Zephyr's cbprintf).
CONFIG_PICOLIBC_IO_FLOAT=n
CONFIG_CBPRINTF_FP_SUPPORT=n
