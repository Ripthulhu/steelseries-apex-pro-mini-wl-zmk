#
# Bench-only overlay that reproduces the failed STM32 stopped-state experiment.
# Kept separate so a normal build remains the byte-exact device baseline. Mode 0
# hard-stops the scanner; neither a key nor stock's link-resync routine wakes it.
# The 50-ms attempt is bounded and falls back to scanner power-cycle/replay.
# Allowing USB keeps APXSTOP evidence visible on CDC. This is forensic evidence,
# not a candidate daily-driver configuration.

CONFIG_APEX_G4B_STM32_STOP1_IDLE_MS=5000
CONFIG_APEX_G4B_STM32_STOP1_POLL_MS=50
CONFIG_APEX_G4B_STM32_STOP1_ALLOW_USB=y
