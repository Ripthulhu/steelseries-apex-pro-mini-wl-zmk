#
# Opt-in wireless shell over the BLE Nordic UART Service. Layered on the shell
# build by build_g4b.py --ble-shell (which implies --shell). The bridge is off
# at runtime until `apex bleshell on`, which persists the choice. Not part of
# the shipped release: keep it to debug builds so the shipped firmware carries
# no wireless debug surface.
CONFIG_APEX_G4B_BLE_SHELL=y
