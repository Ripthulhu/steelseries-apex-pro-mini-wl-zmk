# SPDX-License-Identifier: MIT
#
# Release trim for the shell-enabled shipping image. Layered after g4b_shell.conf
# by tools/build_release.py so the shipped firmware keeps the interactive apex
# shell, the SWD-replacement tools, the apex Studio RPC and deferred logging, but
# drops the pure bench/test diagnostics that add runtime cost and do not belong
# in a release.

# Live UART telemetry is a bring-up/testing aid, not a shipped feature.
CONFIG_APEX_G4B_KBD_TELEMETRY=n

# Thread runtime profiling adds a periodic accounting cost. `kernel threads` and
# `kernel stacks` still work from THREAD_MONITOR / THREAD_STACK_INFO.
CONFIG_THREAD_ANALYZER=n
CONFIG_THREAD_ANALYZER_USE_PRINTK=n
CONFIG_THREAD_RUNTIME_STATS=n

# Stack-fill instrumentation, only used to measure headroom on the bench.
CONFIG_INIT_STACKS=n
