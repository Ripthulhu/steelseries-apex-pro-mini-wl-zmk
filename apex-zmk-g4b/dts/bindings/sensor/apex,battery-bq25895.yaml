# SPDX-License-Identifier: MIT
#
# The BQ25895 charger acting as the battery gauge.
#
# No reg/bus properties: this driver does not sit on a Zephyr I2C bus. It talks
# to the charger through src/twi_g4b.c, which drives legacy TWI1 by direct
# register access in the same style as the SPIM link and the RGB controller.
# That is deliberate - this build forces CONFIG_I2C, CONFIG_SPI, CONFIG_GPIO and
# CONFIG_PINCTRL off, and verify_g4b.py fails the build if any of them reappear.
# Pulling in Zephyr's I2C stack just to read one register would undo that.

description: BQ25895 charger used as a battery state-of-charge sensor

compatible: "apex,battery-bq25895"

include: sensor-device.yaml
