# Wireless scanner timing used by release builds (Bluetooth and dongle).
#
# Primary cadence is 1 ms. After five seconds of battery-powered wireless
# inactivity it changes to 50 ms, then to 100 ms after one minute. The first
# detected change restores 1 ms; detection itself can take one idle period.
CONFIG_APEX_G4B_STM32_IDLE_SCAN_PERIOD_MS=50
CONFIG_APEX_G4B_STM32_LONG_IDLE_SCAN_PERIOD_MS=100
CONFIG_APEX_G4B_STM32_LONG_IDLE_AFTER_MS=60000
