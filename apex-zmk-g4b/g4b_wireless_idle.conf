# Bluetooth scanner timing used by release builds.
#
# Primary cadence is 1 ms. After five seconds of battery-powered Bluetooth
# inactivity it changes to 50 ms, then to the protocol maximum of 255 ms after
# one minute. A scanner callback immediately restores the 1 ms cadence.
CONFIG_APEX_G4B_STM32_IDLE_SCAN_PERIOD_MS=50
CONFIG_APEX_G4B_STM32_LONG_IDLE_SCAN_PERIOD_MS=255
CONFIG_APEX_G4B_STM32_LONG_IDLE_AFTER_MS=60000
