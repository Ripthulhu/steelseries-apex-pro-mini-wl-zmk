# SPDX-License-Identifier: MIT
#
# Debug/observability overlay for the stage-3 USB build. Layered on top of
# g4b_usb.conf by `build_g4b.py --shell`, which also defines APEX_G4B_SHELL_DTS
# so g4b_usb.overlay adds the shell CDC-ACM port. This is NOT the release image:
# it enables the interactive `apex` shell + logging (extra RAM/flash, and logging
# can perturb the tuned scanner/radio timing), so the --shell build deliberately
# skips the plain-image release audit.

CONFIG_APEX_G4B_SHELL=y

# --- interactive shell over the shell_cdc USB CDC-ACM port -------------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# The kernel shell commands (`kernel stacks/threads`) need thread stack info;
# without it the link fails on z_impl_k_thread_stack_space_get. Also handy for
# debugging RAM/stack usage.
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_SHELL_PROMPT_UART="apex$ "
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_CMD_BUFF_SIZE=128

# --- logging, routed through the shell backend (one port for shell + logs) ---
# The shell OWNS the CDC port; logs go through the shell backend, not a separate
# UART console/backend (which would fight the shell for the same device).
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# Logs route to the shell via CONFIG_SHELL_LOG_BACKEND (default y when LOG+SHELL
# and not minimal log mode) - no separate LOG backend symbol needed here.
CONFIG_LOG_DEFAULT_LEVEL=3
# (Shell chattiness is fixed at the source: mode_gate_work is now edge-triggered,
# so ZMK no longer re-selects the endpoint - and logs a <dbg>+<wrn> pair - every
# second. Remaining stray logs are quieted at boot by the runtime filter in
# apex_shell_g4b.c; raise any module with `log enable <level> [module]`.)
# ZMK caps logging to a minimal (formatting-free) mode by default; lift it so
# real log strings come through on this debug build.
CONFIG_ZMK_LOGGING_MINIMAL=n

# printk to the shell (no separate UART console on the shared port).
CONFIG_PRINTK=y

# --- SWD-replacement power tools --------------------------------------------
# Each replaces a debug operation that previously required an SWD probe.
# Reboot / DFU entry (apex dfu writes GPREGRET + resets).
CONFIG_REBOOT=y
# Arbitrary memory + peripheral register peek/poke (devmem <addr> [w] [val]).
CONFIG_DEVMEM_SHELL=y
# Internal + external flash read/erase/write from the shell (flash <dev> ...).
CONFIG_FLASH_SHELL=y
# Chip identity + reset cause (hwinfo devid / hwinfo reset_cause).
CONFIG_HWINFO=y
CONFIG_HWINFO_SHELL=y
# Kernel introspection: threads, stacks, uptime, cycles, version, reboot.
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_RUNTIME_STATS=y
# Runtime log control: enable/disable/level per module (log ...).
CONFIG_LOG_CMDS=y
# Device list + readiness (device list).
CONFIG_DEVICE_SHELL=y
# Read/write persisted settings incl. the apex/switch record + bonds (settings).
CONFIG_SETTINGS_SHELL=y
# Bigger shell stack for flash dumps / hexdumps / thread analysis.
CONFIG_SHELL_STACK_SIZE=4096

# --- apex Studio RPC (heatmap) ----------------------------------------------
# The stock RPC TX buffer is 64 B; the usage-heatmap response (128 per-key
# counts) is far bigger, so enlarge it or the response truncates.
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=1024
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256

# --- live telemetry for testing ---------------------------------------------
CONFIG_APEX_G4B_KBD_TELEMETRY=y
